name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The asset names below are the ones the README's install command
      # downloads, and the ones v0.2.0 already published. They are raw
      # binaries, not archives — a `.tar.gz` has never existed for this repo,
      # so the README used to point at a URL that could never resolve.
      - name: Build
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${GITHUB_REF_NAME}"
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_linux_amd64   .
          GOOS=linux  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_linux_arm64   .
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_darwin_amd64  .
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_darwin_arm64  .
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_windows_amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/agentcard-mcp_windows_arm64.exe .

      - name: Checksums
        run: |
          cd dist
          sha256sum agentcard-mcp_* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentcard-mcp_linux_amd64
            dist/agentcard-mcp_linux_arm64
            dist/agentcard-mcp_darwin_amd64
            dist/agentcard-mcp_darwin_arm64
            dist/agentcard-mcp_windows_amd64.exe
            dist/agentcard-mcp_windows_arm64.exe
            dist/SHA256SUMS
          generate_release_notes: true
