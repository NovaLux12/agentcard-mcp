name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go mod download
      - name: go test
        run: go test -race -count=1 ./...
      - name: go build
        run: |
          go build -ldflags="-s -w" -o dist/agentcard-mcp .
          file dist/agentcard-mcp
      - name: end-to-end stdio smoke
        run: bash scripts/smoke.sh