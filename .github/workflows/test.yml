name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    uses: NovaLux12/.github/.github/workflows/go-ci.yml@main
  smoke:
    name: end-to-end stdio smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build -ldflags="-s -w" -o dist/agentcard-mcp .
      - name: end-to-end stdio smoke
        run: bash scripts/smoke.sh
